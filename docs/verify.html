<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>용도지역 대조 시험</title>
<style>body{font:14px/1.5 system-ui,"Malgun Gothic",sans-serif;margin:16px;max-width:1100px}button{font:inherit;padding:7px 14px}
table{border-collapse:collapse;width:100%;margin-top:10px}td,th{border:1px solid #ccc;padding:4px 8px;vertical-align:top;font-size:12.5px;word-break:break-all}
.ok{color:#0a7a3d;font-weight:700}.no{color:#b3261e;font-weight:700}.nf{color:#8a6d00}pre{white-space:pre-wrap;background:#f3f3f3;padding:8px}</style></head><body>
<h2>용도지역 대조 시험</h2>
<p>지도 레이어 방식(도구가 쓰는 방식)과 V-World 토지이용계획 조회(NED, 필지번호 기준)를 필지마다 대조합니다. 두 번째 방식이 이 키로 열리는지는 시험 전에는 확인되지 않았습니다.</p>
<p id="env" style="background:#fff7d6;padding:6px"></p>
<p><button id="go">대조 실행 (16필지, 약 2분)</button> <span id="st"></span></p>
<table><thead><tr><th>필지</th><th>지도 레이어 결과(도구)</th><th>NED 조회 결과(필지번호)</th><th>판정</th></tr></thead><tbody></tbody></table>
<details open><summary>복사용 요약</summary><pre id="raw"></pre></details>
<script src="geo.js"></script>
<script>
var KEY=BFGeo.getKey(),DOM=BFGeo.domain(),seq=0,LOG=[];
document.getElementById("env").textContent="접속 주소: "+location.href+" | 키 길이: "+(KEY||"").length+" | 코드 버전: "+BFGeo.version;
function jsonp(url,params){return new Promise(function(res,rej){var n="__v"+(++seq),s=document.createElement("script");
 var to=setTimeout(function(){c();rej(new Error("시간 초과"))},20000);function c(){clearTimeout(to);delete window[n];s.remove()}
 window[n]=function(d){c();res(d)};s.onerror=function(){c();rej(new Error("요청 실패(JSONP)"))};
 params.callback=n;s.src=url+"?"+new URLSearchParams(params).toString();document.head.appendChild(s)})}
async function ned(pnu){
 var p={key:KEY,domain:DOM,pnu:pnu,format:"json",numOfRows:"100",pageNo:"1"},u="https://api.vworld.kr/ned/data/getLandUseAttr";
 try{var r=await fetch(u+"?"+new URLSearchParams(p).toString());return await r.json()}catch(e){}
 return await jsonp(u,p)}
function nedNames(r){var f=r&&r.landUses&&r.landUses.field;if(!f)return null;if(!Array.isArray(f))f=[f];
 return f.map(function(x){return (x.prposAreaDstrcCodeNm||"")+"("+(x.cnflcAt||"")+")"})}
function pickZoneNames(names){return names.filter(function(n){return /지역\(/.test(n)&&!/지구|구역/.test(n)})}
function row(a,b,c,d,cls){var tr=document.createElement("tr");[a,b,c,d].forEach(function(v,i){var td=document.createElement("td");td.textContent=v;if(i===3)td.className=cls||"";tr.appendChild(td)});
 document.querySelector("tbody").appendChild(tr);LOG.push([a,b,c,d].join(" | "));document.getElementById("raw").textContent=LOG.join("\n")}
document.getElementById("go").onclick=async function(){
 document.querySelector("tbody").innerHTML="";LOG=[];var st=document.getElementById("st");
 if(!KEY){st.textContent="키가 저장돼 있지 않습니다";return}
 var data=await (await fetch("data.json?"+Date.now())).json(),seen={},sel=[];
 data.items.filter(function(i){return i.pnu&&i.pnu.length===19&&i.pnu.slice(11,15)!=="0000"&&i.area_m2}).forEach(function(i){var k=i.pnu.slice(0,5);if(!seen[k]){seen[k]=1;sel.push(i)}});
 sel=sel.sort(function(a,b){return a.pnu<b.pnu?-1:1}).filter(function(_,i){return i%Math.max(1,Math.floor(sel.length/16))===0}).slice(0,16);
 var agree=0,tot=0,nedFail=0;
 for(var i=0;i<sel.length;i++){var it=sel[i];st.textContent=(i+1)+"/"+sel.length+" "+it.name;
  var A="",B="",V="";
  try{var r=await BFGeo.check(it);
   if(r.error){A="오류: "+r.error}else{var z=(r.layers&&r.layers.zone)||{};A=(z.names||[]).join(", ")||(z.status==="none"?"해당 레이어 없음":z.status)}
   var pnu=(r.parcel&&r.parcel.pnu)||it.pnu;
   try{var n=await ned(pnu),nm=nedNames(n);
    if(nm){var zn=pickZoneNames(nm);B=(zn.length?zn.join(", "):"(용도지역 항목 없음) 전체: "+nm.join(", ").slice(0,160))}
    else{B="NED 응답 형식 이상: "+JSON.stringify(n).slice(0,160);nedFail++}
   }catch(e){B="NED 실패: "+e.message;nedFail++}
   if(A&&!/^오류|^해당 레이어/.test(A)&&!/^NED/.test(B)&&!/응답 형식/.test(B)){tot++;
     var an=A.split(/,\s*/),hit=an.every(function(x){return B.indexOf(x)>=0});if(hit){agree++;V="일치"}else V="불일치"}
   else V="판정 불가"
  }catch(e){A="실패: "+e.message;V="판정 불가"}
  row(it.name.slice(0,40)+" ["+it.pnu.slice(0,5)+"]",A,B,V,V==="일치"?"ok":V==="불일치"?"no":"nf");
 }
 st.textContent="끝. 판정 가능 "+tot+"건 중 일치 "+agree+"건, NED 실패 "+nedFail+"건. 아래 '복사용 요약'을 복사해 보내주세요."};
</script></body></html>
