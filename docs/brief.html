table.tb td{border-bottom:1px solid var(--ln);padding:.6cqw .9cqw;vertical-align:top}
td.stt{color:var(--or);font-weight:700;white-space:nowrap}
td.ok{color:#2e7d4f;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:2.2cqw}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4cqw;margin-bottom:1.6cqw}

.box{background:var(--lt);border-radius:.6cqw;padding:1.2cqw 1.6cqw;font-size:1.15cqw;color:var(--dk);margin-top:1.4cqw}
