name: fetch_probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p probe && python3 scripts/fetch_probe.py > probe/fetch.txt 2>&1; tail -c 400 probe/fetch.txt
      - run: |
          git config user.name "collector"; git config user.email "collector@users.noreply.github.com"
          git add probe; git commit -m "probe: fetch" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
