name: kepco
on:
  schedule:
    - cron: "23 * * * *"   # 매시간 23분: 한전 여유용량 조금씩 조회
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  kepco:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 한전 여유용량 조회
        env:
          KEPCO_API_KEY: ${{ secrets.KEPCO_API_KEY }}
        run: python scripts/kepco_only.py
      - name: 결과 저장
        run: |
          git config user.name "collector"
          git config user.email "collector@users.noreply.github.com"
          git add docs/kepco.json
          git diff --cached --quiet && exit 0
          git commit -m "data: kepco"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 10; done
          exit 1
