name: kepco_one
on:
  workflow_dispatch:
    inputs:
      pnu: {required: true}
      emd: {required: true}
      li: {required: false, default: ""}
      jibun: {required: false, default: ""}
permissions:
  contents: write
jobs:
  q:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - env:
          KEPCO_API_KEY: ${{ secrets.KEPCO_API_KEY }}
          PNU: ${{ inputs.pnu }}
          EMD: ${{ inputs.emd }}
          LI: ${{ inputs.li }}
          JIBUN: ${{ inputs.jibun }}
        run: python3 scripts/kepco_one.py
      - run: |
          git config user.name "collector"; git config user.email "collector@users.noreply.github.com"
          git add docs/kepcoq; git commit -m "data: kepco one" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
