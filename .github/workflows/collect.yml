name: collect
on:
  schedule:
    - cron: "0 0,6 * * *"   # 매일 09:00, 15:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 온비드 수집
        env:
          ONBID_SERVICE_KEY: ${{ secrets.ONBID_SERVICE_KEY }}
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          KEPCO_API_KEY: ${{ secrets.KEPCO_API_KEY }}
        run: python scripts/collect.py
      - name: 결과 저장
        run: |
          git config user.name "collector"
          git config user.email "collector@users.noreply.github.com"
          git add docs/data.json
          [ -f docs/kepco.json ] && git add docs/kepco.json || true
          git diff --cached --quiet || (git commit -m "data: update" && git push)
