name: eco_probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyproj
      - env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: mkdir -p probe && python scripts/eco_probe.py > probe/eco.txt 2>&1; tail -c 300 probe/eco.txt
      - run: |
          git config user.name "collector"; git config user.email "collector@users.noreply.github.com"
          git add probe; git commit -m "probe: eco" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
